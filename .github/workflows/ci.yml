name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Verify Functions Framework CLI
        run: node node_modules/@google-cloud/functions-framework/build/src/main.js --help

  rust:
    name: Rust ${{ matrix.check }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, clippy, test, build, audit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - if: matrix.check != 'fmt' && matrix.check != 'audit'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev protobuf-compiler libprotobuf-dev
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ matrix.check }}-${{ hashFiles('Cargo.lock') }}
      - if: matrix.check == 'fmt'
        run: cargo fmt --all -- --check
      - if: matrix.check == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: matrix.check == 'test'
        run: cargo test --workspace --all-features --locked
      - if: matrix.check == 'build'
        run: cargo build --workspace --all-features --locked
      - if: matrix.check == 'audit'
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit

  all-checks:
    name: All Checks Pass
    runs-on: ubuntu-24.04
    needs: [node, rust]
    if: always()
    steps:
      - run: |
          test '${{ needs.node.result }}' = success
          test '${{ needs.rust.result }}' = success
